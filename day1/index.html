<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day 1 | semantic html</title>
    <style>
        html{
            background-color:rgb(20, 20, 19);
        }
        body{
            width: 80%;
            margin: 0 auto;
            background-color:rgb(247, 231, 212);
            font-family: Courier, monospace;
            font-size: 1.5rem;
            font-weight: bold;
            color:rgb(31, 29, 27);
            border: 3px solid rgb(247, 206, 157);
            border-radius: 10px;
            padding: 20px;
            text-align: justify;
        }
        footer{
            font-size: 12px;
            text-align: center;
            color:rgb(31, 29, 27);
            background-color:rgb(247, 206, 157);
            border: 3px solid rgb(247, 206, 157);
            border-radius: 10px;
            padding: 5px;
        }
        #profile-pic{
            border: 3px solid rgb(247, 206, 157);
            border-radius: 50%;
            margin-top: 20px;
            margin: 0 auto;
            align-items: center;
            justify-content: center;
            display: flex; 
        }
        h1{
            text-align: center;
            color:rgb(228, 171, 102);
        }
        header{
            font-size: 12px;
            text-align: center;
            padding: 10px;
            color:rgb(31, 29, 27);
            background-color:rgb(247, 206, 157);
            border: 3px solid rgb(247, 206, 157);
            border-radius: 10px;
        }
        ul{
            text-align: center;
            list-style-type: none;
            justify-content: center;
            display: flex;
            gap: 10px;
        }
        #instagram, #github, #linkedin, #email, #website{
            text-decoration: none;
            color:rgb(31, 29, 27);
            font-weight: bold;
        }
        p{
            font-size: 18px;
            color:rgb(31, 29, 27);
            text-align: justify;
        }
    </style>    
</head>
<header>
    <div class="social-networks">
        <ul>
            <li><a id="instagram" href="https://instagram.com/thigasfal1" target="_blank">Instagram</a></li>
            <li><a id="github" href="https://github.com/thiagofal1" target="_blank">GitHub</a></li>
            <li><a id="linkedin" href="https://linkedin.com/in/thiagofal1" target="_blank">LinkedIn</a></li>
            <li><a id="email" href="mailto:thiago.alencar842@gmail.com" target="_blank">Email</a></li>
            <li><a id="website" href="https://thigasfal.dev" target="_blank">My Website</a></li>
        </ul>   
    </div>
</header>
<body>
    </br>
    <img id="profile-pic" src="https://avatars.githubusercontent.com/u/188096561?v=4" alt="Thiago Alencar" width="200" height="200">
    <h1>Hello, World!</h1>
    <p>My name's Thiago Alencar, but you can call me Thigas!</br>
    I'm a software developer passionate about creating innovative solutions.</p>
</body>
<footer>
    <p>© 2024 Thiago Alencar. All rights reserved.</p>
</footer>
</html>
