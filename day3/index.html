<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora financeira ABSOLUTA">
    <title>day 3 | JavaScript</title>
</head>
<body>
    <header>
        <h1>finance.js</h1>
    </header>
    <h2>Entradas</h2>
    <div id="entradas">
        <div class="entrada">
            <label>
                Nome:
                <input type="text" class="entrada-nome">
            </label>
            <br>
            <label>
                Valor:
                <input type="number" class="entrada-valor" step="0.01">
            </label>
        </div>
    </div>
    <button type="button" id="addEntrada">+</button>
    <h2>Saídas</h2>
    <div id="saidas">
        <div class="saida">
            <label>
                Nome:
                <input type="text" class="saida-nome">
            </label>
            <br>
            <label>
                Valor:
                <input type="number" class="saida-valor" step="0.01">
            </label>
        </div>
    </div>
    <button type="button" id="addSaida">+</button>
    <br><br>
    <button type="button" id="calc">Calcular</button>
    <br><br>
    <div id="resultadoBox" class="resultado">
        <p id="resultado"></p>
        <p id="avaliacao"></p>
    </div>
    <script src="main.js"></script>
</body>
</html>
